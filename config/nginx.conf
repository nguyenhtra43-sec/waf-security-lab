server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Bật ModSecurity engine
    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsecurity.d/setup.conf;
    modsecurity_rules_file /etc/nginx/modsecurity.d/owasp-crs/crs-setup.conf;
    modsecurity_rules_file /etc/nginx/modsecurity.d/owasp-crs/rules/*.conf;

    location / {
        default_type text/html;
        return 200 "OK - WAF Security Lab Active";
    }
}