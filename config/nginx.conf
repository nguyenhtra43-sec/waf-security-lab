server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Bật ModSecurity và trỏ tới file cấu hình chuẩn của CRS
    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsecurity.d/include.conf;

    location / {
        default_type text/html;
        return 200 "OK - WAF Security Lab Active";
    }
}