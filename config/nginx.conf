server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Bật ModSecurity Module
    modsecurity on;

    # Cấu hình trực tiếp ModSecurity Engine & Load bộ luật CRS
    modsecurity_rules '
        SecRuleEngine On
        SecRequestBodyAccess On
        SecResponseBodyAccess On
        
        # Load file cấu hình chuẩn & bộ luật OWASP CRS có sẵn trong container
        include /etc/nginx/modsecurity.d/modsecurity.conf
        include /opt/owasp-crs/crs-setup.conf
        include /opt/owasp-crs/rules/*.conf
    ';

    location / {
        default_type text/html;
        return 200 "OK - WAF Security Lab Active";
    }
}