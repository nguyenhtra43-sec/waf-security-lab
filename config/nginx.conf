server {
    listen 80 default_server;
    listen [::]:80 default_server;

    modsecurity on;

    # Ép ModSecurity chuyển sang chế độ Self-Contained (Chặn ngay lập tức khi dính Rule)
    modsecurity_rules '
        SecRuleEngine On
        SecDefaultAction "phase:2,deny,status:403,log,auditlog"
    ';

    location / {
        default_type text/html;
        return 200 "OK - WAF Security Lab Active";
    }
}