server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Cho phép Nginx đọc file cấu hình ModSecurity đã được script gốc sinh ra
    include /etc/nginx/modsecurity.d/include.conf;

    location / {
        default_type text/html;
        return 200 "OK - WAF Security Lab Active";
    }
}