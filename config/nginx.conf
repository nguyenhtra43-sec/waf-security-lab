server {
    listen 80 default_server;
    listen [::]:80 default_server;

    modsecurity on;
    modsecurity_rules '
        SecRuleEngine On
        SecDefaultAction "phase:1,log,deny,status:403"
        SecDefaultAction "phase:2,log,deny,status:403"
    ';

    location / {
        default_type text/html;
        return 200 "OK - WAF Security Lab Active";
    }
}