server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Bật ModSecurity Module
    modsecurity on;

    # ÉP BẮT BUỘC CHẶN (SecRuleEngine On)
    modsecurity_rules '
        SecRuleEngine On
    ';

    location / {
        default_type text/html;
        return 200 "OK - WAF Security Lab Active";
    }
}