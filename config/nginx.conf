server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Bật WAF ModSecurity
    modsecurity on;
    
    # Nạp file cấu hình tổng hợp chuẩn do image owasp-crs tự tạo
    modsecurity_rules_file /etc/nginx/modsecurity.d/modsecurity.conf;

    location / {
        default_type text/html;
        return 200 "OK - WAF Security Lab Active";
    }
}