server {
    listen 80 default_server;
    listen [::]:80 default_server;

    modsecurity on;

    # Nạp trực tiếp file override do script container tạo ra
    modsecurity_rules_file /etc/nginx/modsecurity.d/modsecurity-override.conf;

    location / {
        default_type text/html;
        return 200 "OK - WAF Security Lab Active";
    }
}