server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Bật ModSecurity Engine
    modsecurity on;
    
    # Bắt buộc ModSecurity chặn các request vi phạm rule (Trả về 403 Forbidden)
    modsecurity_rules '
        SecRuleEngine On
    ';

    location / {
        default_type text/html;
        return 200 "OK - WAF Security Lab Active";
    }
}