server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Bật ModSecurity Engine
    modsecurity on;

    # ÉpModSecurity chặn các request vi phạm (Mã 403)
    modsecurity_rules '
        SecRuleEngine On
    ';

    location / {
        default_type text/html;
        return 200 "OK - WAF Security Lab Active";
    }
}